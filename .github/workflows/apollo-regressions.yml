name: Apollo regression checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lightweight test dependencies
        run: python -m pip install cryptography numpy
      - name: Reject newly tracked private runtime files
        run: python apollo_ui/tools/audit_repository.py --check-new --base origin/main
      - name: Validate source syntax and module manifests
        working-directory: apollo_ui
        run: python apollo_health_check.py --root .
      - name: Run custom sidebar, voice and updater regression suite
        working-directory: apollo_ui
        run: python -m unittest -v test_sidebar_layout test_sidebar_gui_wiring test_voice_queue_state test_update_preflight test_memory_corrections test_personality_controls test_recovery_snapshots test_system_job_ui test_local_config test_xtts_shared_path test_github_updates test_obd_reader test_voice_management test_window_geometry
      - name: Run existing shell and module manager tests
        working-directory: apollo_ui
        run: |
          python test_apollo_shell.py
          python test_module_manager_surfaces.py
      - name: Validate staged Coding Team module without installation
        working-directory: apollo_ui
        run: python pending_modules/coding_team/tests.py
      - name: Validate updater and XTTS modules in the sandbox
        working-directory: apollo_ui
        run: |
          APOLLO_BASE_DIR="$PWD" python module_validator.py modules/update_manager
          APOLLO_BASE_DIR="$PWD" python module_validator.py modules/voice_imprint_trainer
          APOLLO_BASE_DIR="$PWD" python module_validator.py modules/vehicle_diagnostics
      - name: Test signed update rollback
        working-directory: apollo_ui
        run: python test_update_system.py
