name: Runtime data hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  private-data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Guard regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Reject tracked runtime data and keys
        run: python3 tools/check_sensitive_tracking.py
      - name: Scan indexed content for credential patterns (redacted output)
        run: python3 tools/check_sensitive_tracking.py --secrets
